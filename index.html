<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Pong</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1020 60%, #05070f 100%);
      color: #e5e7eb;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .game-shell {
      text-align: center;
      width: min(92vw, 900px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f9fafb;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #c7d2fe;
    }

    canvas {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 3 / 2;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: linear-gradient(180deg, #0f172a, #020617);
      box-shadow: 0 14px 34px rgba(2, 6, 23, 0.6);
      display: block;
    }

    .controls {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    kbd {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 1px 6px;
      color: #f8fafc;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>Pong — First to 7</h1>
    <div class="hud">
      <div>Player: <strong id="playerScore">0</strong></div>
      <div>CPU: <strong id="cpuScore">0</strong></div>
      <div>Status: <strong id="statusText">Press Space to Start</strong></div>
    </div>
    <canvas id="pong" width="900" height="600" aria-label="Pong game"></canvas>
    <p class="controls">
      Move with <kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd>. Press <kbd>Space</kbd> to start/restart.
    </p>
  </main>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('playerScore');
    const cpuScoreEl = document.getElementById('cpuScore');
    const statusTextEl = document.getElementById('statusText');

    const GAME_WIDTH = canvas.width;
    const GAME_HEIGHT = canvas.height;
    const WIN_SCORE = 7;

    const paddle = {
      width: 14,
      height: 110,
      speed: 7
    };

    const ball = {
      size: 14,
      baseSpeed: 5.2,
      maxSpeed: 11
    };

    let player = { x: 24, y: (GAME_HEIGHT - paddle.height) / 2, dy: 0, score: 0 };
    let cpu = { x: GAME_WIDTH - 24 - paddle.width, y: (GAME_HEIGHT - paddle.height) / 2, dy: 0, score: 0 };
    let orb = { x: GAME_WIDTH / 2, y: GAME_HEIGHT / 2, vx: 0, vy: 0 };

    let running = false;
    let gameOver = false;
    let lastTime = 0;

    const keys = new Set();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setStatus(text) {
      statusTextEl.textContent = text;
    }

    function resetBall(direction = 1) {
      orb.x = GAME_WIDTH / 2;
      orb.y = GAME_HEIGHT / 2;
      const angle = (Math.random() * 0.6 - 0.3);
      const speed = ball.baseSpeed;
      orb.vx = Math.cos(angle) * speed * direction;
      orb.vy = Math.sin(angle) * speed;
    }

    function resetGame() {
      player.score = 0;
      cpu.score = 0;
      player.y = cpu.y = (GAME_HEIGHT - paddle.height) / 2;
      playerScoreEl.textContent = '0';
      cpuScoreEl.textContent = '0';
      gameOver = false;
      running = true;
      setStatus('Playing');
      resetBall(Math.random() > 0.5 ? 1 : -1);
    }

    function scorePoint(side) {
      if (side === 'player') {
        player.score += 1;
        playerScoreEl.textContent = String(player.score);
      } else {
        cpu.score += 1;
        cpuScoreEl.textContent = String(cpu.score);
      }

      if (player.score >= WIN_SCORE || cpu.score >= WIN_SCORE) {
        running = false;
        gameOver = true;
        setStatus(player.score > cpu.score ? 'You win! Press Space' : 'CPU wins! Press Space');
        orb.vx = orb.vy = 0;
        return;
      }

      running = false;
      setStatus('Point scored! Press Space');
      resetBall(side === 'player' ? -1 : 1);
    }

    function handleInput() {
      player.dy = 0;
      if (keys.has('w') || keys.has('ArrowUp')) player.dy = -paddle.speed;
      if (keys.has('s') || keys.has('ArrowDown')) player.dy = paddle.speed;
      player.y = clamp(player.y + player.dy, 0, GAME_HEIGHT - paddle.height);
    }

    function moveCpu() {
      const target = orb.y - paddle.height / 2 + ball.size / 2;
      const reaction = 0.085;
      const error = (Math.random() - 0.5) * 20;
      cpu.dy = (target - cpu.y + error) * reaction;
      cpu.dy = clamp(cpu.dy, -paddle.speed * 0.92, paddle.speed * 0.92);
      cpu.y = clamp(cpu.y + cpu.dy, 0, GAME_HEIGHT - paddle.height);
    }

    function collideWithPaddle(p) {
      return (
        orb.x < p.x + paddle.width &&
        orb.x + ball.size > p.x &&
        orb.y < p.y + paddle.height &&
        orb.y + ball.size > p.y
      );
    }

    function updateBall(deltaFactor) {
      orb.x += orb.vx * deltaFactor;
      orb.y += orb.vy * deltaFactor;

      if (orb.y <= 0 || orb.y + ball.size >= GAME_HEIGHT) {
        orb.y = clamp(orb.y, 0, GAME_HEIGHT - ball.size);
        orb.vy *= -1;
      }

      if (collideWithPaddle(player) && orb.vx < 0) {
        const rel = (orb.y + ball.size / 2 - (player.y + paddle.height / 2)) / (paddle.height / 2);
        const speed = Math.min(Math.hypot(orb.vx, orb.vy) + 0.35, ball.maxSpeed);
        const bounce = rel * 0.85;
        orb.vx = Math.abs(Math.cos(bounce) * speed);
        orb.vy = Math.sin(bounce) * speed;
        orb.x = player.x + paddle.width;
      }

      if (collideWithPaddle(cpu) && orb.vx > 0) {
        const rel = (orb.y + ball.size / 2 - (cpu.y + paddle.height / 2)) / (paddle.height / 2);
        const speed = Math.min(Math.hypot(orb.vx, orb.vy) + 0.35, ball.maxSpeed);
        const bounce = rel * 0.85;
        orb.vx = -Math.abs(Math.cos(bounce) * speed);
        orb.vy = Math.sin(bounce) * speed;
        orb.x = cpu.x - ball.size;
      }

      if (orb.x + ball.size < 0) scorePoint('cpu');
      if (orb.x > GAME_WIDTH) scorePoint('player');
    }

    function drawNet() {
      ctx.strokeStyle = 'rgba(148,163,184,0.5)';
      ctx.setLineDash([10, 14]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(GAME_WIDTH / 2, 18);
      ctx.lineTo(GAME_WIDTH / 2, GAME_HEIGHT - 18);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function render() {
      drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#020617');
      drawNet();

      drawRect(player.x, player.y, paddle.width, paddle.height, '#60a5fa');
      drawRect(cpu.x, cpu.y, paddle.width, paddle.height, '#f472b6');
      drawRect(orb.x, orb.y, ball.size, ball.size, '#f8fafc');

      if (!running) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'center';
        ctx.font = '600 44px Segoe UI';
        if (gameOver) {
          ctx.fillText(player.score > cpu.score ? 'Victory!' : 'Defeat!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 24);
        } else {
          ctx.fillText('PONG', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 24);
        }
        ctx.font = '500 24px Segoe UI';
        ctx.fillText('Press Space to Serve', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 24);
      }
    }

    function gameLoop(ts) {
      if (!lastTime) lastTime = ts;
      const deltaMs = ts - lastTime;
      lastTime = ts;
      const deltaFactor = Math.min(deltaMs / 16.67, 1.5);

      handleInput();
      if (running) {
        moveCpu();
        updateBall(deltaFactor);
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      keys.add(e.key);

      if (e.key === ' ' && !running) {
        if (gameOver || (player.score === 0 && cpu.score === 0 && orb.vx === 0 && orb.vy === 0)) {
          resetGame();
        } else {
          running = true;
          setStatus('Playing');
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys.delete(e.key);
    });

    orb.vx = 0;
    orb.vy = 0;
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
